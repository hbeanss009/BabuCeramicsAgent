# .github/workflows/weekly_batch.yml
name: Weekly Batch Eval

on:
  schedule:
    - cron: '36 01 * * 0'  # Every Saturday 5:36 PM PST = Sunday 1:36 AM UTC
  workflow_dispatch:     # Manual trigger

jobs:
  weekly_batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run weekly batch eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python eval/weekly_batch_from_conversations.py
      
      - name: Create results directory if it doesn't exist
        run: |
          mkdir -p eval/weekly_batches
      
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly_eval_results
          path: eval/weekly_batches/
          retention-days: 365
